name: Auto EPG Updater

on:
  schedule:
    - cron: '0 */6 * * *' # Si attiva automaticamente ogni 6 ore
  workflow_dispatch: # Permette l'avvio manuale

permissions:
  contents: write # <-- QUESTO PERMESSO RISOLVE L'ERRORE 128

jobs:
  update-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Python script
        run: |
          python update_epg.py

      - name: Commit and Push EPG
        run: |
          git config --global user.name "EPG Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add epg.xml
          git commit -m "Aggiornamento automatico palinsesto EPG" || exit 0
          git push
